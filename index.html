<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ee">
  <meta name="description" content="Controle seus gastos, separe dinheiro em potes e acompanhe suas metas.">
  <title>Banco do Murilo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Banco">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica o tema antes de pintar a tela, para não piscar
    try {
      var t = JSON.parse(localStorage.getItem('bancodomurilo:theme') || '"auto"');
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="auth" class="auth">
    <div class="auth-card"><img src="icon.svg" class="auth-logo" alt=""><div class="spinner"></div></div>
  </div>

  <div class="app" hidden>
    <aside class="sidebar">
      <a class="brand" href="#inicio"><img src="icon.svg" alt=""><span>Banco do Murilo</span></a>
      <nav class="side-nav" aria-label="Principal"></nav>
      <button class="btn primary block" data-action="new-tx">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Novo lançamento
      </button>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <div class="content">
      <header class="topbar" id="topbar"></header>
      <main id="view"></main>
    </div>

    <nav class="bottomnav" aria-label="Principal"></nav>
    <button class="fab" data-action="new-tx" aria-label="Novo lançamento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
